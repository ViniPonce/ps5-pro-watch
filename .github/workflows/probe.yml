name: PS5 probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Best Buy button
        run: |
          python - << 'PY'
          import json, urllib.request
          url = (
              "https://www.bestbuy.com/api/tcfb/model.json?paths="
              "%5B%5B%22shop%22%2C%22buttonstate%22%2C%22v5%22%2C%22item%22%2C%22skus%22%2C6601524%2C"
              "%22conditions%22%2C%22NONE%22%2C%22destinationZipCode%22%2C33129%2C%22storeId%22%2C%22%22%2C"
              "%22context%22%2C%22pdp%22%2C%22addAll%22%2C%22false%22%5D%5D&method=get"
          )
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
              "Referer": "https://www.bestbuy.com/product/playstation-5-pro-console/JXHQ37TR86/sku/6601524",
          })
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read().decode("utf-8", "replace")
                  print("status", response.status, "len", len(body))
          except Exception as exc:
              print("failed", type(exc).__name__)
              raise SystemExit(0)
          try:
              data = json.loads(body)
          except Exception:
              print(body[:300].replace("\n", " "))
              raise SystemExit(0)
          states = []
          def walk(node):
              if isinstance(node, dict):
                  if "buttonState" in node:
                      states.append({
                          "buttonState": node.get("buttonState"),
                          "skuId": node.get("skuId"),
                          "displayText": node.get("displayText"),
                      })
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(data)
          print("states", json.dumps(states)[:800])
          PY
