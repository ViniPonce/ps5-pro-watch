name: PS5 watch

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ps5-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: ps5-state-${{ github.run_id }}
          restore-keys: ps5-state-

      - name: Check retailers
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_FOR: "18000"
        run: python check.py

      - name: Queue the next check
        if: always() && hashFiles('ended.flag') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run check.yml --ref main

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: ps5-state-${{ github.run_id }}
